<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Radar BTC·ETH</title>
<style>
:root{
  --ink:#0F1B2D;--panel:#16263D;--panel2:#1C3050;--line:#284163;--text:#E8EEF7;--mute:#8FA3BF;--faint:#5F7594;
  --long:#34D399;--short:#FB7185;--warn:#FBBF24;
  --btc:#F7931A;--eth:#8EA2FF;--coin:var(--btc);
  --r-big:22px;--r-mid:14px;--r-small:9px;
}
body.eth{--coin:var(--eth)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.45 Roboto,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
body{padding:0 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

/* top bar: the two coins */
.top{position:sticky;top:0;z-index:5;background:var(--ink);padding:12px 0 10px;display:flex;align-items:center;gap:10px}
.coins{flex:1;display:flex;background:var(--panel);border-radius:999px;padding:4px}
.coins button{flex:1;padding:9px 0;border-radius:999px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,color .2s}
.coins button .sym{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.coins button[data-c=BTC] .sym{background:var(--btc)}
.coins button[data-c=ETH] .sym{background:var(--eth)}
.coins button[aria-pressed=true]{background:var(--panel2);color:var(--text)}
.icon{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--mute)}
.icon svg{width:20px;height:20px}

/* hero: the price */
.hero{padding:14px 0 6px;position:relative}
.hero .price{font-size:52px;font-weight:300;letter-spacing:-1.5px;line-height:1;color:var(--text)}
.hero .price small{font-size:22px;color:var(--mute);letter-spacing:0;margin-left:4px}
.hero .glow{position:absolute;left:-40px;top:-30px;width:220px;height:160px;background:radial-gradient(closest-side,color-mix(in srgb,var(--coin) 30%,transparent),transparent);pointer-events:none;z-index:-1}
.hero .sub{margin-top:8px;display:flex;gap:10px;align-items:center;color:var(--mute);font-size:14px}
.chg{font-weight:600}.up{color:var(--long)}.dn{color:var(--short)}
.stamp{margin-left:auto;font-size:12px;color:var(--faint)}

/* time units */
.tf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px}
.tf div{background:var(--panel);border-radius:var(--r-small);padding:8px 0 7px;text-align:center}
.tf b{display:block;font-size:12px;color:var(--mute);font-weight:500}
.tf .ar{font-size:20px;line-height:24px;display:block}
.tf .rs{font-size:11px;color:var(--faint)}
.tf .bar{height:3px;border-radius:2px;background:var(--line);margin:4px 10px 0;position:relative;overflow:hidden}
.tf .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}

/* chart */
.chart{margin:14px 0 0;background:var(--panel);border-radius:var(--r-big);padding:12px 10px 6px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .lg{display:flex;gap:14px;font-size:12px;color:var(--mute);padding:0 4px 6px}
.chart .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

h2{font-size:19px;font-weight:600;margin:26px 2px 4px;display:flex;align-items:baseline;gap:8px}
h2 span{font-size:13px;color:var(--mute);font-weight:400}
.lead{color:var(--mute);font-size:13px;margin:0 2px 12px}

/* a configuration */
.cfg{background:var(--panel);border-radius:var(--r-big);margin-bottom:12px;overflow:hidden;border-left:4px solid var(--line)}
.cfg.L{border-left-color:var(--long)}.cfg.S{border-left-color:var(--short)}
.cfg.ready{box-shadow:0 0 0 1px color-mix(in srgb,var(--coin) 55%,transparent)}
.cfg .hd{display:flex;align-items:center;gap:10px;padding:14px 14px 4px;width:100%;text-align:left}
.dir{font-weight:700;font-size:13px;padding:3px 9px;border-radius:7px}
.L .dir{background:color-mix(in srgb,var(--long) 18%,transparent);color:var(--long)}
.S .dir{background:color-mix(in srgb,var(--short) 18%,transparent);color:var(--short)}
.cfg .nm{font-weight:600;font-size:16px;flex:1;min-width:0}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.pill.ready{background:var(--coin);color:var(--ink)}
.pill.wait{background:var(--panel2);color:var(--text)}
.pill.mixed{background:var(--panel2);color:var(--warn)}
.pill.counter{background:transparent;color:var(--mute);border:1px solid var(--line)}
.pill.refused{background:transparent;color:var(--faint);border:1px dashed var(--line)}
.cfg.refused .ladder,.cfg.counter .ladder{opacity:.55}
.ladder{padding:4px 10px 0}
.ladder svg{display:block;width:100%;height:auto}
.nums{display:grid;grid-template-columns:repeat(4,1fr);padding:4px 14px 10px;gap:4px}
.nums div{font-size:12px;color:var(--mute)}
.nums b{display:block;font-size:15px;color:var(--text);font-weight:600}
.size{margin:0 14px;padding:10px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
.size b{color:var(--text);font-weight:600}
.size .bad{color:var(--warn)}
.hist{margin:0 14px;padding:10px 0 12px;border-top:1px solid var(--line)}
.hist .t{font-size:12px;color:var(--mute);margin-bottom:6px}
.hb{display:grid;grid-template-columns:62px 1fr 74px;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:3px 0}
.hb .track{height:8px;background:var(--ink);border-radius:5px;position:relative;overflow:hidden}
.hb .track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.hb .track u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55}
.hb .v{text-align:right;color:var(--text)}
.hb .v em{font-style:normal;color:var(--mute)}
.why{padding:0 14px 12px;font-size:13px;color:var(--mute)}
.more{display:none;padding:0 14px 14px;font-size:13px;color:var(--mute)}
.cfg.open .more{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px}
.chips span.on{background:color-mix(in srgb,var(--coin) 22%,transparent);color:var(--text)}
.off{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;background:var(--panel);border-radius:var(--r-mid);padding:10px 14px;margin-bottom:8px;opacity:.8}
.off .nm{font-size:14px;font-weight:600}.off em{font-style:normal;color:var(--mute);font-weight:400;margin-left:6px}
.off .rs{grid-column:2;font-size:12px;color:var(--faint)}
.empty{background:var(--panel);border-radius:var(--r-big);padding:22px;text-align:center;color:var(--mute)}
.note{color:var(--faint);font-size:12px;margin:22px 2px 0}
.err{background:color-mix(in srgb,var(--short) 15%,var(--panel));border-radius:var(--r-mid);padding:12px 14px;margin-top:12px;font-size:14px}
.err button{margin-top:8px;text-decoration:underline}
.skel{height:120px;border-radius:var(--r-big);background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sk 1.4s infinite;margin-top:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.coins button{transition:none}}

/* settings sheet */
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.6);display:none;z-index:20;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:var(--panel);width:100%;max-width:560px;margin:0 auto;border-radius:var(--r-big) var(--r-big) 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field label{color:var(--mute);font-size:14px}
.field input{width:120px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:var(--r-small);padding:9px 10px;font:inherit;text-align:right}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:left .2s}
.sw[aria-checked=true]{background:var(--coin)}.sw[aria-checked=true]::after{left:23px}
.btn{display:block;width:100%;padding:13px;border-radius:var(--r-mid);background:var(--coin);color:var(--ink);font-weight:700;margin-top:16px}
.btn.ghost{background:var(--panel2);color:var(--text);margin-top:10px}
.small{font-size:12px;color:var(--faint);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="coins" role="group" aria-label="Crypto">
      <button data-c="BTC" aria-pressed="true"><span class="sym">₿</span>Bitcoin</button>
      <button data-c="ETH" aria-pressed="false"><span class="sym">Ξ</span>Ether</button>
    </div>
    <button class="icon" id="reload" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
    <button class="icon" id="gear" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <main id="main"><div class="skel"></div><div class="skel"></div></main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="box">
    <h3 id="sheetTitle">Mon profil de trade</h3>
    <div class="field"><label for="fCap">Capital du compte (USDT)</label><input id="fCap" type="number" inputmode="decimal" min="0" step="1"></div>
    <div class="field"><label for="fRisk">Risque par trade (%)</label><input id="fRisk" type="number" inputmode="decimal" min="0.1" max="10" step="0.1"></div>
    <div class="field"><label for="fLev">Levier</label><input id="fLev" type="number" inputmode="numeric" min="1" max="50" step="1"></div>
    <div class="field"><label for="fMargin">Marge max par trade (%)</label><input id="fMargin" type="number" inputmode="numeric" min="1" max="100" step="1"></div>
    <h3 style="margin-top:22px">Alertes</h3>
    <div class="field"><label id="lWatch">Prévenir quand une configuration devient « Prêt »</label><button class="sw" id="fWatch" role="switch" aria-checked="false" aria-labelledby="lWatch"></button></div>
    <div class="field"><label id="lNear">Prévenir aussi quand le prix arrive à 0,3 % d'une zone</label><button class="sw" id="fNear" role="switch" aria-checked="false" aria-labelledby="lNear"></button></div>
    <div class="small" id="lastCheck"></div>
    <button class="btn" id="save">Enregistrer</button>
    <button class="btn ghost" id="testAlert">Envoyer une alerte de test</button>
    <div class="small">L'appli lit seulement les prix publics de Binance Futures. Elle ne demande aucune clé et ne passe aucun ordre.</div>
  </div>
</div>

<script>
/*<ENGINE>*/
/*</ENGINE>*/
/*<CONFIGS>*/
/*</CONFIGS>*/
/*<HIST>*/
/*</HIST>*/

/* ---------- state ---------- */
var BG=/[?&]bg=1/.test(location.search);
var DEF={capital:1000,risk:2,lev:10,margin:25,watch:false,near:false};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var prof=Object.assign({},DEF,load("profile",{})),coin=load("coin","BTC"),DATA={},RULES=load("rules",null),busy=false;
var YLAB={A:"2024-25",B:"2025-26"};

/* ---------- Binance public data (through the app's relay) ---------- */
function getJSON(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Binance a répondu "+r.status);return r.json()})}
function kl(sym,iv,n){return getJSON("/fapi/v1/klines?symbol="+sym+"USDT&interval="+iv+"&limit="+n).then(function(a){
  return a.map(function(r){return{t:+r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4],q:+r[7],b:+r[10]}})})}
function rules(){
  if(RULES&&RULES.at>Date.now()-7*864e5)return Promise.resolve(RULES);
  return getJSON("/fapi/v1/exchangeInfo").then(function(x){var out={at:Date.now()};
    (x.symbols||[]).forEach(function(s){if(s.symbol!=="BTCUSDT"&&s.symbol!=="ETHUSDT")return;var r={};
      (s.filters||[]).forEach(function(f){if(f.filterType==="PRICE_FILTER")r.tick=+f.tickSize;if(f.filterType==="LOT_SIZE"){r.step=+f.stepSize;r.minQty=+f.minQty}if(f.filterType==="MIN_NOTIONAL")r.minNotional=+f.notional});
      out[s.symbol.replace("USDT","")]=r});
    RULES=out;save("rules",out);return out}).catch(function(){return RULES||{}})}
function fetchCoin(sym){
  return Promise.all([kl(sym,"1d",400),kl(sym,"4h",200),kl(sym,"1h",200),kl(sym,"15m",300),getJSON("/fapi/v1/ticker/24hr?symbol="+sym+"USDT"),rules()])
    .then(function(r){var c={d1:r[0],h4:r[1],h1:r[2],m15:r[3]},tk=r[4];
      var R=beConfigs(sym,c,{});R.chg=+tk.priceChangePercent;R.at=Date.now();R.c=c;R.X=(r[5]||{})[sym]||null;return R})}

/* ---------- prices on the contract grid ---------- */
function decOf(step){if(!(step>0))return 2;var s=String(step);if(s.indexOf("e-")>0)return +s.split("e-")[1];var i=s.indexOf(".");return i<0?0:s.length-i-1}
function onTick(v,tick,mode){if(!(tick>0))return v;var q=v/tick,n=mode==="up"?Math.ceil(q-1e-9):mode==="down"?Math.floor(q+1e-9):Math.round(q);return +(n*tick).toFixed(decOf(tick))}
function gridPlan(p,dir,X){var t=X&&X.tick;if(!t)return p;
  /* entry to the nearest step, stop moved away from the entry, targets moved toward it */
  return Object.assign({},p,{entry:onTick(p.entry,t),sl:onTick(p.sl,t,dir>0?"down":"up"),tp1:onTick(p.tp1,t,dir>0?"down":"up"),tp2:onTick(p.tp2,t,dir>0?"down":"up")})}
function P(v,sym){return fr(v,sym==="BTC"?1:2)}
function money(v){return fr(v,Math.abs(v)>=100?0:2)+" $"}

/* ---------- history of a configuration on this coin ---------- */
function hist(sym,key,tr){
  var H=window.BE_HIST;if(!H)return null;
  function pick(c,k){var o={};for(var y in YLAB){var v=H.coins[c]&&H.coins[c][y]&&H.coins[c][y][k];o[y]=v||[0,0,0]}return o}
  var own=pick(sym,key+"|"+tr),cfg=pick(sym,key),both=pick("BOTH",key+"|"+tr),MIN=15;
  function enough(o){return o.A[0]>=MIN&&o.B[0]>=MIN}
  if(enough(own))return{label:"Sur "+sym+", "+trLabel(tr),o:own};
  if(enough(cfg))return{label:"Sur "+sym+", toutes tendances",o:cfg};
  if(enough(both))return{label:"Sur BTC et ETH, "+trLabel(tr),o:both};
  return{label:"Sur "+sym+", toutes tendances (peu de cas)",o:cfg,few:true}}
function trLabel(tr){return tr==="with"?"dans la tendance":tr==="against"?"contre la tendance":"tendance mitigée"}

/* ---------- drawing ---------- */
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function arrow(b){return b>0?'<span class="ar up">▲</span>':b<0?'<span class="ar dn">▼</span>':'<span class="ar" style="color:var(--mute)">◆</span>'}

function drawChart(R){
  var k=R.c.h4.slice(-72),W=340,H=190,pad=6,lo=Infinity,hi=-Infinity;
  k.forEach(function(c){if(c.l<lo)lo=c.l;if(c.h>hi)hi=c.h});
  R.list.forEach(function(c){if(c.st==="refused")return;lo=Math.min(lo,c.plan.sl);hi=Math.max(hi,c.plan.sl)});
  var span=hi-lo||1;lo-=span*0.03;hi+=span*0.03;span=hi-lo;
  var cw=(W-44)/k.length,y=function(v){return pad+(hi-v)/span*(H-2*pad)},s="";
  /* zones of the configurations */
  var drawn={};
  R.list.forEach(function(c){var id=c.zone.lo.toFixed(4);if(drawn[id])return;drawn[id]=1;
    var col=c.dir>0?"var(--long)":"var(--short)",op=c.st==="refused"||c.st==="counter"?0.10:0.22;
    s+='<rect x="0" y="'+y(c.zone.hi).toFixed(1)+'" width="'+(W-44)+'" height="'+Math.max(2,y(c.zone.lo)-y(c.zone.hi)).toFixed(1)+'" fill="'+col+'" opacity="'+op+'" rx="3"/>';
    s+='<text x="4" y="'+(y(c.zone.hi)-3).toFixed(1)+'" font-size="9" fill="'+col+'">'+(c.dir>0?"Long ":"Short ")+esc(c.short)+'</text>'});
  k.forEach(function(c,i){var x=i*cw+cw/2,up=c.c>=c.o,col=up?"var(--long)":"var(--short)",yt=y(Math.max(c.o,c.c)),yb=y(Math.min(c.o,c.c));
    s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+y(c.h).toFixed(1)+'" y2="'+y(c.l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    s+='<rect x="'+(x-cw*0.32).toFixed(1)+'" y="'+yt.toFixed(1)+'" width="'+(cw*0.64).toFixed(1)+'" height="'+Math.max(1,yb-yt).toFixed(1)+'" fill="'+col+'"/>'});
  var yp=y(R.price);
  s+='<line x1="0" x2="'+(W-44)+'" y1="'+yp.toFixed(1)+'" y2="'+yp.toFixed(1)+'" stroke="var(--coin)" stroke-dasharray="3 3"/>';
  s+='<rect x="'+(W-43)+'" y="'+(yp-9).toFixed(1)+'" width="43" height="18" rx="4" fill="var(--coin)"/><text x="'+(W-21.5)+'" y="'+(yp+3.5).toFixed(1)+'" font-size="9.5" text-anchor="middle" fill="var(--ink)" font-weight="700">'+fr(R.price,R.sym==="BTC"?0:1)+'</text>';
  [hi-span*0.08,lo+span*0.08].forEach(function(v){s+='<text x="'+(W-2)+'" y="'+(y(v)+3).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--faint)">'+fr(v,R.sym==="BTC"?0:1)+'</text>'});
  return '<div class="chart"><div class="lg"><span>4H · 12 jours</span><span><i style="background:var(--long)"></i>zones long</span><span><i style="background:var(--short)"></i>zones short</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bougies 4 heures et zones des configurations">'+s+'</svg></div>'}

/* stop, entry, targets and the price on one line, spaced by their real distances */
function drawLadder(c,p,price){
  var dir=c.dir,pts=[p.sl,p.entry,p.tp1,p.tp2,price],lo=Math.min.apply(null,pts),hi=Math.max.apply(null,pts),W=340,H=58,m=14;
  var x=function(v){var t=(v-lo)/(hi-lo||1);return m+(dir>0?t:1-t)*(W-2*m)};
  var xs=x(p.sl),xe=x(p.entry),x1=x(p.tp1),x2=x(p.tp2),xp=x(price),s="";
  s+='<rect x="'+Math.min(xs,xe)+'" y="22" width="'+Math.abs(xe-xs)+'" height="10" rx="3" fill="var(--short)" opacity=".8"/>';
  s+='<rect x="'+Math.min(xe,x1)+'" y="22" width="'+Math.abs(x1-xe)+'" height="10" rx="3" fill="var(--long)" opacity=".85"/>';
  s+='<rect x="'+Math.min(x1,x2)+'" y="22" width="'+Math.abs(x2-x1)+'" height="10" rx="3" fill="var(--long)" opacity=".35"/>';
  function tick(xv,lab,anchor){return '<line x1="'+xv+'" x2="'+xv+'" y1="18" y2="36" stroke="var(--text)" stroke-width="1.5"/><text x="'+xv+'" y="13" font-size="10" fill="var(--mute)" text-anchor="'+anchor+'">'+lab+'</text>'}
  var a=function(xv){return xv<40?"start":xv>W-40?"end":"middle"};
  s+=tick(xs,"Stop",a(xs))+tick(xe,"Entrée",a(xe))+tick(x1,"TP1",a(x1))+tick(x2,"TP2",a(x2));
  s+='<path d="M'+xp+' 40 l-5 8 h10 z" fill="var(--coin)"/><text x="'+xp+'" y="57" font-size="9.5" fill="var(--coin)" text-anchor="'+a(xp)+'">prix</text>';
  return '<div class="ladder"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Stop, entrée et objectifs">'+s+'</svg></div>'}

function drawHist(h){
  if(!h)return"";
  var be=0;
  var rows=Object.keys(YLAB).map(function(y){var v=h.o[y],n=v[0],w=v[1],r=v[2];
    return '<div class="hb"><span>'+YLAB[y]+'</span><span class="track"><i style="width:'+Math.min(100,w)+'%;background:'+(r>0?"var(--long)":"var(--mute)")+'"></i></span><span class="v">'+(n?fr(w,0)+' % <em>'+(r>=0?"+":"−")+fr(Math.abs(r),2)+'R</em>':"—")+'</span></div>'}).join("");
  var nA=h.o.A[0],nB=h.o.B[0];
  return '<div class="hist"><div class="t">TP1 touché avant le stop · '+esc(h.label)+' · '+nA+' et '+nB+' cas</div>'+rows+'</div>'}

function card(c,R){
  var X=R.X,p=gridPlan(c.plan,c.dir,X),sz=beSize(p,c.dir,prof,X),h=hist(R.sym,c.key,c.trend),L=c.dir>0?"L":"S";
  var size="";
  if(sz){var marginOk=sz.marginPct<=+prof.margin;
    size='<div class="size"><span>Taille <b>'+fr(sz.qty,decOf(X&&X.step||0.001))+' '+R.sym+'</b></span><span>Marge <b class="'+(marginOk?"":"bad")+'">'+money(sz.margin)+'</b> ('+fr(sz.marginPct,0)+' %)</span><span>Perte au stop <b>'+money(sz.loss)+'</b></span><span>Gain TP1 <b>'+money(sz.gain)+'</b></span>'+
      (sz.liqFirst?'<span class="bad">Liquidation avant le stop : baisse le levier</span>':"")+(!marginOk?'<span class="bad">Marge au-dessus de ton maximum</span>':"")+(!sz.ok?'<span class="bad">Sous la taille minimale Binance</span>':"")+'</div>'}
  var T=c.trig,chips=T?['<span class="'+(T.sweep?"on":"")+'">Mèche de liquidité</span>','<span class="'+(T.bos?"on":"")+'">Cassure 15 min</span>','<span class="'+(T.candle?"on":"")+'">Bougie de retournement</span>','<span class="'+(T.rsi?"on":"")+'">RSI 15 min qui tourne</span>'].join(""):"";
  var more='<div class="more">'+(T?'Signaux 15 minutes au contact (information : ils n\'ont pas amélioré le résultat sur deux ans)<div class="chips">'+chips+'</div>':'Pas encore au contact : les signaux 15 minutes s\'afficheront quand le prix sera dans la zone.')+
    '<p>Zone '+P(c.zone.lo,R.sym)+' – '+P(c.zone.hi,R.sym)+' · prix à '+fr(c.distPct,2)+' % · stop à '+fr(Math.abs(p.entry-p.sl)/p.entry*100,2)+' % de l\'entrée · gain/risque net après frais '+fr(c.plan.rrNet,2)+'.</p>'+
    (sz?'<p>Liquidation estimée vers '+P(sz.liq,R.sym)+' au levier '+prof.lev+'.</p>':"")+'</div>';
  return '<article class="cfg '+L+' '+c.st+'"><button class="hd" aria-expanded="false"><span class="dir">'+(c.dir>0?"LONG":"SHORT")+'</span><span class="nm">'+esc(c.short)+'</span><span class="pill '+c.st+'">'+BE_STATUS[c.st]+'</span></button>'+
    drawLadder(c,p,R.price)+
    '<div class="nums"><div>Entrée<b>'+P(p.entry,R.sym)+'</b></div><div>Stop<b>'+P(p.sl,R.sym)+'</b></div><div>TP1<b>'+P(p.tp1,R.sym)+'</b></div><div>Gain/risque<b>'+fr(p.rr,1)+'</b></div></div>'+
    (c.why.length?'<div class="why">'+esc(c.why.join(" · "))+'</div>':"")+
    size+drawHist(h)+more+'</article>'}

function render(){
  var R=DATA[coin],main=document.getElementById("main");
  document.body.className=coin==="ETH"?"eth":"";
  document.querySelectorAll(".coins button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.c===coin))});
  if(!R){main.innerHTML='<div class="skel"></div><div class="skel"></div>';return}
  if(R.err){main.innerHTML='<div class="err">Impossible de lire les prix : '+esc(R.err)+'<br><button id="retry">Réessayer</button></div>';document.getElementById("retry").onclick=refresh;return}
  var tfs=R.frames.map(function(f){var r=f.rsi==null?null:f.rsi;
    return '<div><b>'+f.label+'</b>'+arrow(f.b)+'<span class="rs">RSI '+(r==null?"—":fr(r,0))+'</span><span class="bar"><i style="width:'+(r||0)+'%;background:'+(r>70?"var(--short)":r<30?"var(--long)":"var(--mute)")+'"></i></span></div>'}).join("");
  var ready=R.list.filter(function(c){return c.st==="ready"}).length,live=R.list.filter(function(c){return c.st!=="refused"});
  var h='<section class="hero"><div class="glow"></div><div class="price">'+fr(R.price,R.sym==="BTC"?1:2)+'<small>USDT</small></div>'+
    '<div class="sub"><span class="chg '+(R.chg>=0?"up":"dn")+'">'+sgn(R.chg,2)+' %</span><span>sur 24 h</span><span class="stamp">'+new Date(R.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+'</span></div></section>'+
    '<div class="tf" aria-label="Tendance et RSI par unité de temps">'+tfs+'</div>'+drawChart(R)+
    '<h2>Configurations <span>'+(ready?ready+" prête"+(ready>1?"s":""):live.length+" à suivre")+'</span></h2>'+
    '<p class="lead">Les zones 4H les plus proches, en long sous le prix et en short au-dessus. Touche une carte pour le détail.</p>';
  var refused=R.list.filter(function(c){return c.st==="refused"});
  h+=live.length?live.map(function(c){return card(c,R)}).join(""):'<div class="empty">Aucune configuration jouable pour le moment. Reviens après la prochaine bougie 4H.</div>';
  if(refused.length)h+='<h2>Écartées <span>'+refused.length+'</span></h2>'+refused.map(function(c){var p=gridPlan(c.plan,c.dir,R.X);
    return '<div class="off '+(c.dir>0?"L":"S")+'"><span class="dir">'+(c.dir>0?"LONG":"SHORT")+'</span><span class="nm">'+esc(c.short)+' <em>'+P(p.entry,R.sym)+'</em></span><span class="rs">'+esc(c.why.join(" · "))+'</span></div>'}).join("");
  h+='<p class="note">Les taux sont des fréquences passées sur deux années séparées, frais compris : ils ne donnent pas la chance d\'un trade précis. Aucune configuration n\'a gagné de façon régulière les deux années. Ce n\'est pas un conseil financier.</p>';
  main.innerHTML=h;
  main.querySelectorAll(".cfg .hd").forEach(function(b){b.onclick=function(){var a=b.parentNode,o=a.classList.toggle("open");b.setAttribute("aria-expanded",String(o))}})}

function refresh(){
  if(busy)return;busy=true;var sym=coin;
  return fetchCoin(sym).then(function(R){DATA[sym]=R}).catch(function(e){DATA[sym]=DATA[sym]&&!DATA[sym].err?DATA[sym]:{err:e.message||"réseau indisponible"}})
    .then(function(){busy=false;if(sym===coin)render();
      var other=sym==="BTC"?"ETH":"BTC";if(!DATA[other])fetchCoin(other).then(function(R){DATA[other]=R}).catch(function(){})})}

/* ---------- settings ---------- */
var sheet=document.getElementById("sheet");
function sw(id,v){document.getElementById(id).setAttribute("aria-checked",String(!!v))}
function openSheet(){
  document.getElementById("fCap").value=prof.capital;document.getElementById("fRisk").value=prof.risk;
  document.getElementById("fLev").value=prof.lev;document.getElementById("fMargin").value=prof.margin;
  var on=window.Android&&Android.watching?Android.watching():prof.watch;sw("fWatch",on);sw("fNear",prof.near);
  var lc=window.Android&&Android.lastCheck?Android.lastCheck():"";document.getElementById("lastCheck").textContent=lc?"Dernier contrôle en arrière-plan : "+lc:"";
  sheet.classList.add("on")}
["fWatch","fNear"].forEach(function(id){document.getElementById(id).onclick=function(){var b=this;b.setAttribute("aria-checked",String(b.getAttribute("aria-checked")!=="true"))}});
document.getElementById("save").onclick=function(){
  function num(id,min,max,d){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?d:Math.min(max,Math.max(min,v))}
  prof.capital=num("fCap",0,1e9,DEF.capital);prof.risk=num("fRisk",0.1,10,DEF.risk);prof.lev=Math.round(num("fLev",1,50,DEF.lev));prof.margin=num("fMargin",1,100,DEF.margin);
  prof.watch=document.getElementById("fWatch").getAttribute("aria-checked")==="true";prof.near=document.getElementById("fNear").getAttribute("aria-checked")==="true";
  save("profile",prof);
  if(window.Android){if(prof.watch&&Android.startWatch)Android.startWatch(15);else if(!prof.watch&&Android.stopWatch)Android.stopWatch()}
  sheet.classList.remove("on");render()};
document.getElementById("testAlert").onclick=function(){if(window.Android&&Android.test)Android.test()};
sheet.onclick=function(e){if(e.target===sheet)sheet.classList.remove("on")};
window.goBack=function(){if(sheet.classList.contains("on")){sheet.classList.remove("on");return true}return false};

/* ---------- background check (hidden page of the watch service) ---------- */
window.bgScan=function(){
  var seen=load("seen",{}),now=Date.now(),sent=0,p=load("profile",DEF);
  for(var k in seen)if(seen[k]<now-12*36e5)delete seen[k];
  Promise.all(["BTC","ETH"].map(function(s){return fetchCoin(s).catch(function(){return null})})).then(function(all){
    all.forEach(function(R){if(!R)return;
      R.list.forEach(function(c){
        var near=p.near&&c.st==="wait"&&c.distPct<=0.3,tag=R.sym+c.key+Math.round(c.zone.lo)+(near?"n":"r");
        if((c.st!=="ready"&&!near)||seen[tag])return;
        seen[tag]=now;sent++;var pl=gridPlan(c.plan,c.dir,R.X);
        Android.notify((near?"Prix proche · ":"Prêt · ")+R.sym+" "+(c.dir>0?"long":"short"),c.short+" · entrée "+P(pl.entry,R.sym)+" · stop "+P(pl.sl,R.sym)+" · TP1 "+P(pl.tp1,R.sym),tag)})});
    save("seen",seen);
    var ok=all.filter(Boolean).length;
    if(window.Android&&Android.done)Android.done(ok<2?"données incomplètes":sent?sent+" alerte"+(sent>1?"s":""):"rien de nouveau")})};

/* ---------- start ---------- */
if(!BG){
  document.querySelectorAll(".coins button").forEach(function(b){b.onclick=function(){coin=b.dataset.c;save("coin",coin);render();if(!DATA[coin]||Date.now()-(DATA[coin].at||0)>60000)refresh()}});
  document.getElementById("reload").onclick=refresh;document.getElementById("gear").onclick=openSheet;
  render();refresh();
  setInterval(function(){if(!document.hidden)refresh()},60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&DATA[coin]&&Date.now()-DATA[coin].at>60000)refresh()})}
</script>
</body>
</html>
