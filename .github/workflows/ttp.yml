name: Time to TP v42
# Replays the version 42 engine on the two years and measures how long its winning setups took to reach TP1 (tools/backtest/ttp42.js).
on:
  push:
    branches: [ttp-run]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: A, start: "2024-09", end: "2025-10" }
          - { id: B, start: "2025-10", end: "2026-10" }
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candles
        env: { START: "${{ matrix.start }}", END: "${{ matrix.end }}" }
        run: node tools/backtest/fetch.js klines data 2>&1 | tail -5
      - name: Replay and measure
        run: |
          mkdir -p res
          for k in 0 1 2 3; do TAG=v42 node tools/backtest/ref.js data res 2 $k/4 & done; wait
          node tools/backtest/ttp42.js rows res data res/ttp-rows.json
          node tools/backtest/ttp42.js table res/ttp-rows.json | tee res/ttp-table.txt
      - name: Publish
        run: |
          cd res && git init -q -b ttp-v42-${{ matrix.id }}
          git config user.name radar-backtest && git config user.email noreply@github.com
          git add ttp-rows.json ttp-table.txt && git commit -qm "Time to TP v42 ${{ matrix.id }}" && git push -q -f "$REMOTE" ttp-v42-${{ matrix.id }}
