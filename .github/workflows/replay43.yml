name: Replay v42 vs v43
# Replays the version 42 engine (frozen in tools/backtest/engine_v42.js) and the current engine on the same two years of Binance history,
# at the 6-check and the 4-check precision, and publishes the comparison to the branch replay-v43-<period>.
on:
  push:
    branches: [v43]
    paths: ["tools/engine.js", "tools/backtest/compare43.js", ".github/workflows/replay43.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: A, start: "2024-09", end: "2025-10" }
          - { id: B, start: "2025-10", end: "2026-10" }
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candles
        env: { START: "${{ matrix.start }}", END: "${{ matrix.end }}" }
        run: node tools/backtest/fetch.js klines data 2>&1 | tail -15
      - name: Replay both engines at both precisions
        run: |
          mkdir -p res
          for s in 2 1; do
            for k in 0 1 2 3; do ENGINE=tools/backtest/engine_v42.js TAG=v42s$s node tools/backtest/ref.js data res $s $k/4 & done; wait
            for k in 0 1 2 3; do TAG=v43s$s node tools/backtest/ref.js data res $s $k/4 '{"shadow":true}' & done; wait
          done
          node tools/backtest/compare43.js res | tee res/compare.json
      - name: Publish
        run: |
          cd res && find . -name '*-[0-9].json' -delete
          git init -q -b replay-v43-${{ matrix.id }}
          git config user.name radar-backtest && git config user.email noreply@github.com
          git add -A && git commit -qm "Replay v42 vs v43 ${{ matrix.id }}" && git push -q -f "$REMOTE" replay-v43-${{ matrix.id }}
