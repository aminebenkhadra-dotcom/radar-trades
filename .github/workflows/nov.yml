name: November trades v42
# The trades version 42 would have proposed in November 2026 on the Levels 1 to 3 (app options), listed one by one, to branch nov-check.
# nov-revM / nov-revRB: the same with rebound trades added (study of 23/11/2026, not in the app).
on:
  push:
    branches: [nov-run]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
      START: "2026-10"
      END: "2026-11"
    steps:
      - uses: actions/checkout@v4
      - name: Universe
        run: node tools/backtest/caps.js > caps.env && cut -c1-200 caps.env
      - name: Fetch and replay
        run: |
          . ./caps.env
          SYMS="$CAP12,$CAP3" node tools/backtest/fetch.js klines data | tail -2
          mkdir -p res out
          run() { id=$1; o=$2; mkdir -p r-$id
            for k in 0 1 2 3; do TAG=v42 node tools/backtest/ref.js data r-$id 2 $k/4 "$o" & done; wait
            node tools/backtest/nov42.js r-$id 2026-11-01 > out/$id.json; echo "== $id"; head -c 1200 out/$id.json; echo; }
          A='"slsw":24,"slmode":"flag","reb":7'
          run nov    "{$A}"
          # study of 23/11: the same, with rebound trades after an excess (the two variants of rev.yml), listed one by one
          run nov-revM  "{$A,\"rev\":1}"
          run nov-revRB "{$A,\"rev\":1,\"revTp\":\"r\",\"revR\":1.5,\"revBtc\":1}"
          cp caps.env ranks.json out/
      - name: Publish
        run: |
          cd out && git init -q -b nov-check
          git config user.name radar-backtest && git config user.email noreply@github.com
          git add -A && git commit -qm "November trades" && git push -q -f "$REMOTE" nov-check
