name: Target raise v42
# Binance history, default precision (6 checks), and publishes the trades and the comparison to the branch replay-v42-<period>.
on:
  push:
    branches: [tpup-run]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: A, start: "2024-09", end: "2025-10" }
          - { id: B, start: "2025-10", end: "2026-10" }
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candles
        env: { START: "${{ matrix.start }}", END: "${{ matrix.end }}" }
        run: node tools/backtest/fetch.js klines data 2>&1 | tail -15
      - name: Replay the version 42 engine
        run: |
          mkdir -p res
          for k in 0 1 2 3; do TAG=v42 node tools/backtest/ref.js data res 2 $k/4 '{"tpup":true}' & done; wait
          node tools/backtest/tpup42.js res | tee res/tpup.json
      - name: Publish
        run: |
          cd res && git init -q -b tpup-v42-${{ matrix.id }}
          git config user.name radar-backtest && git config user.email noreply@github.com
          git add -A && git commit -qm "Target raise v42 ${{ matrix.id }}" && git push -q -f "$REMOTE" tpup-v42-${{ matrix.id }}
