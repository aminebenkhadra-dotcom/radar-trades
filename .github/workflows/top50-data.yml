name: Radar Top 50 · historique
# Downloads the 50 USDT futures contracts with the most volume in September 2026 (crypto only: no stablecoin, gold, commodity or tokenised stock),
# 15-minute candles from September 2024 and the 24 months of daily candles before, and publishes them to the branch top50-data.
on:
  push:
    branches: [top50-data-run]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch candles
        env: { START: "2024-09", RANK: "2026-09", TOP: "50", COINS_ONLY: "1", EXCLUDE: "XAU,XAG,PAXG,XAUT" }
        run: node tools/backtest/fetch.js klines data 2>&1 | tail -60
      - name: Publish
        run: |
          cd data && git init -q -b top50-data
          git config user.name radar-backtest && git config user.email noreply@github.com
          git add -A && git commit -qm "Top 50 history $(date -u +%F)" && git push -q -f "$REMOTE" top50-data
