name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > radar.keystore
          elif [ ! -f radar.keystore ]; then
            keytool -genkeypair -keystore radar.keystore -storepass radartrades -keypass radartrades \
              -alias radar -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Radar Trades"
          fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk radar-trades.apk
      - uses: actions/upload-artifact@v4
        with:
          name: radar-trades-apk
          path: radar-trades.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" radar-trades.apk \
            --title "Radar Trades 1.0.${{ github.run_number }}" \
            --notes "APK Android. Telecharge radar-trades.apk puis ouvre-le pour l'installer." --latest
