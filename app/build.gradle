plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
def appVersion = '42'

android {
    namespace 'com.amine.radartrades'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amine.radartrades'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "V${appVersion} (1.0.${runNumber})"
    }
    buildTypes {
        release {
            // built unsigned: the workflow signs it with key rotation (old key -> 2026 key), see signing/CERTIFICATS.md
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
